worker_processes 1;
events { worker_connections 1024; }

http {
    server {
        listen 80;
        
        location /chain {
            set $xff "$http_x_forwarded_for, 10.2.0.12";
            proxy_set_header X-Forwarded-For "$xff";
            proxy_pass http://10.2.0.13:8080;
        }
        
        location /direct {
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Forwarded-For "$remote_addr, 10.2.0.12";
            proxy_pass http://10.2.0.13:8080;
        }
        
        location / {
            set $xff "$http_x_forwarded_for, 10.2.0.12";
            proxy_set_header X-Forwarded-For "$xff";
            proxy_pass http://10.2.0.13:8080;
        }
    }
}
